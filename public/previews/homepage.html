<style>
#light-playground{background:#eeeee9;color:#292925;font:14px Arial,Helvetica,sans-serif}
#light-playground a{color:inherit;text-decoration:none}
#light-playground .lp-header{display:flex;justify-content:space-between;align-items:center;padding:24px 26px;border-bottom:1px solid #d0d0ca}
#light-playground .lp-brand{display:flex;align-items:center;gap:16px;font-size:18px}
#light-playground .lp-brand small{font:11px monospace;color:#72726b}
#light-playground .lp-mark{font-size:40px;letter-spacing:-.1em}
#light-playground .lp-header nav{display:flex;gap:24px;margin-right:80px;font:12px monospace}
#light-playground .lp-intro{display:flex;justify-content:space-between;align-items:end;padding:28px 26px}
#light-playground .lp-intro p{margin:0;font-size:24px;letter-spacing:-.03em;line-height:1.1}
#light-playground .lp-intro>span{font:11px/1.6 monospace;color:#72726b;text-align:right}
#light-playground .lp-index-label{display:flex;justify-content:space-between;padding:12px 26px;font:11px monospace;text-transform:uppercase;border-top:1px solid #d0d0ca}
#light-playground .lp-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:#cecec7}
#light-playground .lp-tile{display:flex;align-items:center;justify-content:center;position:relative;aspect-ratio:1;background:#eeeee9;overflow:hidden}
#light-playground .lp-title{font-size:clamp(18px,2.4vw,32px);letter-spacing:-.04em;position:relative;z-index:4;font-weight:400;text-align:center}
#light-playground .lp-active .lp-title{opacity:0}
#light-playground .lp-tile-top,#light-playground .lp-tile-bottom{position:absolute;left:14px;right:14px;display:flex;justify-content:space-between;gap:8px;z-index:5;font:11px/1.4 monospace;text-transform:uppercase;color:#66665f}
#light-playground .lp-tile-top{top:14px}
#light-playground .lp-tile-bottom{bottom:14px;align-items:end}
#light-playground .lp-tags{max-width:72%;text-transform:none}
#light-playground .lp-state{white-space:nowrap}
#light-playground .lp-active .lp-tile-top,#light-playground .lp-active .lp-tile-bottom{background:#eeeee9eb;color:#292925;padding:6px;left:8px;right:8px}
#light-playground .lp-output{display:none;position:absolute;width:100%;height:100%;inset:0;background:#eeeee9}
#light-playground .lp-active .lp-output{display:block}
#light-playground .lp-engine{position:absolute;left:0;top:0;opacity:0;pointer-events:none;transform-origin:top left}
#light-playground .lp-dom .lp-engine{opacity:1}
#light-playground .lp-footer{display:flex;justify-content:space-between;gap:16px;padding:24px 26px;color:#72726b;font:11px monospace}
@media(max-width:640px){#light-playground .lp-grid{grid-template-columns:repeat(2,minmax(0,1fr))}#light-playground .lp-header{padding:20px 14px;gap:12px;flex-wrap:wrap}#light-playground .lp-header nav{margin-right:0}#light-playground .lp-title{font-size:22px}#light-playground .lp-intro{padding:24px 14px;gap:16px}#light-playground .lp-intro p{font-size:20px}#light-playground .lp-tile-top,#light-playground .lp-tile-bottom{left:10px;right:10px;font-size:11px}#light-playground .lp-tile-top>span:last-child{display:none}#light-playground .lp-footer{flex-wrap:wrap;padding:20px 14px}}
</style>
