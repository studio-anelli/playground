name: Import DURF photography into Playground
on:
  push:
    branches: [feature/durf-campus-landing-lab]
    paths:
      - ".github/workflows/import-durf-assets.yml"
      - "scripts/import_durf_photos.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-durf-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check Pillow
      - name: Download and optimise supplied Unsplash photography
        run: python scripts/import_durf_photos.py
      - name: Commit optimised photography to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/durf-campus/photos
          if ! git diff --cached --quiet; then
            git commit -m "Import DURF photography as hosted WebP assets"
            git push origin HEAD:feature/durf-campus-landing-lab
          fi
